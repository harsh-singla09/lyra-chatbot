<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyra AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
  <div class="sidebar">
    <h2>🤖 Lyra</h2>
    <p>Hey Harsh 👋</p>
  </div>

  <div class="chat-container">

    <div class="header">
      <h1>Lyra AI Assistant</h1>
      <p>Your personal AI companion</p>
    </div>

    <div id="chatbox"></div>

    <div class="input-box">
      <input id="userInput" placeholder="Message Lyra..." />
      <button onclick="sendMessage()">➤</button>
      <button onclick="startVoice()">🎤</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
